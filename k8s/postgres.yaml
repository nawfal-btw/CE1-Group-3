apiVersion: v1
kind: Pod

metadata:
  name: postgres
  labels:
    app: postgres

spec:
  containers:
    - name: postgres
      image: postgres:17

      ports:
        - containerPort: 5432

      env:
        - name: POSTGRES_USER
          value: emergency_user

        - name: POSTGRES_PASSWORD
          value: emergency_password

        - name: POSTGRES_DB
          value: emergency_db

      volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

  volumes:
    - name: postgres-storage
      persistentVolumeClaim:
        claimName: postgres-pvc